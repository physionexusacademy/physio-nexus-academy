name: Prepare staged Manual Therapy WebP fallbacks
on:
  push:
    branches:
      - "staging/manual-all-35-covers-*"
    paths:
      - "public/images/manual-therapy/cards/*.avif"
      - ".github/workflows/manual-avif-fallback-staging.yml"

permissions:
  contents: write

jobs:
  complete-staged-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install WebP and AVIF image encoders
        run: python -m pip install 'Pillow>=11,<13' 'pillow-avif-plugin>=1.4,<2'

      - name: Generate missing WebP fallbacks from verified AVIF assets
        run: |
          python - <<'PY'
          from PIL import Image
          import pillow_avif
          from pathlib import Path
          root=Path("public/images/manual-therapy/cards")
          created=0
          for avif in sorted(root.glob("*.avif")):
            fallback=avif.with_suffix(".webp")
            if fallback.exists(): continue
            with Image.open(avif) as im:
              rgb=im.convert("RGB")
              if rgb.size not in ((400, 500),(480, 600)):
                raise ValueError(f"{avif.name}: unexpected dimensions {rgb.size}")
              for quality in (70,60,50,40,30):
                rgb.save(fallback, "WEBP", quality=quality, method=5)
                if fallback.stat().st_size<=85000: break
              if not 1024<=fallback.stat().st_size<=85000:
                raise ValueError(f"{avif}: webp failed image budget")
            created+=1
          print(f"Created {created} missing WebP fallback assets")
          PY

      - name: Validate staged image pairs against 35-technique manifest
        run: node scripts/validate-manual-visuals.mjs

      - name: Commit fallback assets ONLY to staging branch
        run: |
          if [ -n "$(git status --porcelain public/images/manual-therapy/cards)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/images/manual-therapy/cards/*.webp
            git commit -m "Add WebP fallback for staged AVIF manual therapy images"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "All AVIF pairs already have WebP fallbacks."
          fi
