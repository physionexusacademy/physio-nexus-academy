name: PNA Deep Route Diagnostics (no deploy)

on:
  push:
    branches:
      - diagnostics/manual-deep-routes-20261008
  workflow_dispatch:

jobs:
  probe:
    name: Compare home vs deep routes without changing production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: HTTP diagnostics for PNA routes
        shell: bash
        run: |
          set -u
          urls=(
            "https://physionexusacademy.com/"
            "https://physionexusacademy.com/manual-therapy"
            "https://physionexusacademy.com/manual-therapy/strain-counterstrain"
            "https://physionexusacademy.com/manual-therapy/myofascial-release"
            "https://physionexusacademy.com/manual-therapy/regions"
            "https://physionexusacademy.com/manual-therapy/regions/maitland-cervical-pa-mobilization"
            "https://physionexusacademy.com/manual-therapy/regions/scs-quadratus-lumborum-lumbar"
            "https://physionexusacademy.com/manual-therapy/regions/mulligan-hip-lateral-mwm"
          )
          for pass in 1 2 3; do
            echo "=========== PASS $pass ==========="
            for url in "${urls[@]}"; do
              for agent in curl chrome; do
                if [ "$agent" = chrome ]; then
                  ua="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36"
                else
                  ua="pna-site-diagnostic/1.0"
                fi
                headers="$(mktemp)"
                body="$(mktemp)"
                response="$(curl --http1.1 -sS -L --connect-timeout 8 --max-time 20 --retry 0 -A "$ua" -D "$headers" -o "$body" -w 'http=%{http_code} sec=%{time_total} bytes=%{size_download} IP=%{remote_ip} TLS=%{ssl_verify_result}' "$url" 2>&1)"
                rc=$?
                ray="$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' || true)"
                ct="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
                title="$(grep -o '<title[^>]*>[^<]*' "$body" | head -1 | sed -E 's/<title[^>]*>//' || true)"
                echo "pass=$pass agent=$agent rc=$rc $response $ray $ct title=$title url=$url"
                if [ "$rc" -ne 0 ] || grep -Eq '^HTTP/[^ ]+ (429|5[0-9][0-9])' "$headers"; then
                  echo "  error_body=$(head -c 200 "$body" | tr '\n' ' ')"
                fi
                rm -f "$headers" "$body"
              done
            done
            sleep 3
          done
