name: Deploy PNA to Cloudflare

on:
  push:
    branches:
      - cloudflare-deploy
  workflow_dispatch:

concurrency:
  group: pna-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Cloudflare credentials
        id: auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token is configured."
          else
            echo "::error::Cloudflare deployment cannot run: CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Validate MSK screening engine
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:msk

      - name: Validate every MSK clinical story
        if: steps.auth.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/validate-msk-stories.mjs

      - name: Validate worldwide manual therapy chapters
        if: steps.auth.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/validate-manual-therapy-world.mjs

      - name: Validate PNA story depth and clinical content
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-manual-therapy-stories.mjs

      - name: Validate Manual Therapy visual manifest (inactive until 35 approved)
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-manual-visuals.mjs

      - name: Build and deploy to Cloudflare
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: qoc7ukqs
          NEXT_PUBLIC_CLOUDINARY_3D_ENABLED: "true"
          NEXT_PUBLIC_IMAGEKIT_3D_ENABLED: "false"
          # Disabled until complete 35/35 clinical QA and image checks are finished.
          MANUAL_THERAPY_VISUALS_LIVE: "false"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          PAYMENTS_ENABLED: "false"
        run: |
          if [ "$MANUAL_THERAPY_VISUALS_LIVE" = "true" ]; then
            node scripts/validate-manual-visuals.mjs --publish
          fi
          npx wrangler whoami
          npm run deploy

      - name: Smoke test production
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local marker="$2"

            for attempt in 1 2 3 4 5 6; do
              body="$(curl -fsSL --connect-timeout 10 --max-time 30 "$url?deploy=${GITHUB_SHA}" || true)"
              if grep -Fq "$marker" <<< "$body"; then
                echo "Smoke test passed: $url"
                return 0
              fi

              echo "Smoke test attempt $attempt failed for $url"
              sleep 5
            done

            echo "Smoke test failed: $url did not contain expected marker: $marker"
            return 1
          }

          check_url "https://physionexusacademy.com/" "Check Symptoms"
          check_url "https://physionexusacademy.com/symptom-checker" "PNA Clinical Screening"
          check_url "https://physionexusacademy.com/msk-injuries" 'data-pna-msk-story-library="v1"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-library="unified-35-v1"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-editorial-design="anatomy-luxe-v1"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-editorial-card="maitland-joint-mobilization"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-editorial-card="paris-approach"'
          check_url "https://physionexusacademy.com/manual-therapy" "World Manual Therapy Encyclopedia"
          check_url "https://physionexusacademy.com/manual-therapy/world-approaches" 'data-pna-library="unified-35-v1"'
          for slug in \
            paris-approach mckenzie-mdt mennell-joint-play fascial-distortion-model \
            balanced-ligamentous-tension spencer-shoulder-sequence still-technique \
            osteopathic-articulatory osteopathic-lymphatic-pump rolfing-structural-integration \
            bowen-technique visceral-manipulation craniosacral-therapy
          do
            check_url "https://physionexusacademy.com/manual-therapy/$slug" 'data-pna-world-story="v1"'
            check_url "https://physionexusacademy.com/manual-therapy/$slug" 'data-pna-world-depth="full-chapter-v2"'
            check_url "https://physionexusacademy.com/manual-therapy/$slug" 'data-pna-world-final="v1"'
          done
          check_url "https://physionexusacademy.com/manual-therapy/world-approaches/paris-approach" 'data-pna-world-story="v1"'
          for slug in \
            lateral-ankle-sprain acl-injury meniscal-injury hamstring-strain \
            achilles-tendon-rupture rotator-cuff-tendinopathy \
            rotator-cuff-full-thickness-tear anterior-shoulder-instability \
            femoroacetabular-impingement-syndrome knee-osteoarthritis hip-osteoarthritis \
            cervical-radiculopathy carpal-tunnel-syndrome lateral-epicondylalgia
          do
            check_url "https://physionexusacademy.com/msk-injuries/$slug" 'data-pna-msk-story="cinematic-v1"'
          done
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-content-revision="storytelling-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/myofascial-release" 'data-pna-editorial="v2"'
          check_url "https://physionexusacademy.com/manual-therapy/myofascial-release" 'data-pna-reading="clinical-story-v3"'
          check_url "https://physionexusacademy.com/manual-therapy/strain-counterstrain" 'data-pna-reading="clinical-story-v3"'
          check_url "https://physionexusacademy.com/manual-therapy/regions" "general overviews"
          check_url "https://physionexusacademy.com/manual-therapy/regions" 'data-pna-regions-lite="v1"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/by-region/cervical" 'data-pna-region-overviews="v1"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/guide-facilitated-positional-release-wrist-and-hand" 'data-pna-content-depth="general-overview"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/guide-facilitated-positional-release-wrist-and-hand" 'data-pna-story="regional-overview-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/scs-quadratus-lumborum-lumbar" 'data-pna-content-depth="authored-clinical-story"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/mulligan-hip-lateral-mwm" 'data-pna-content-depth="authored-clinical-story"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-content-revision="storytelling-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/myofascial-release" 'data-pna-engagement="clinical-curveball-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/maitland-cervical-pa-mobilization" 'data-pna-engagement="regional-reading-v3"'
          for slug in \
            maitland-joint-mobilization kaltenborn-evjenth-mobilization \
            mulligan-mobilization-with-movement mulligan-snags-nags \
            cyriax-deep-transverse-friction muscle-energy-technique \
            strain-counterstrain myofascial-release soft-tissue-mobilization \
            trigger-point-compression iastm neurodynamic-mobilization \
            manual-traction high-velocity-low-amplitude-thrust \
            pnf-manual-techniques fascial-manipulation \
            active-release-style-soft-tissue manual-lymphatic-drainage \
            scar-mobilization paivm-ppivm-spinal-assessment \
            myofascial-decompression-dry-cupping facilitated-positional-release
          do
            check_url "https://physionexusacademy.com/manual-therapy/$slug" 'data-pna-reading="clinical-story-v3"'
          done
