name: Deploy PNA to Cloudflare

on:
  push:
    branches:
      - cloudflare-deploy
  workflow_dispatch:

concurrency:
  group: pna-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Cloudflare credentials
        id: auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token is configured."
          else
            echo "::error::Cloudflare deployment cannot run: CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Validate MSK screening engine
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:msk

      - name: Build and deploy to Cloudflare
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: qoc7ukqs
          NEXT_PUBLIC_CLOUDINARY_3D_ENABLED: "true"
          NEXT_PUBLIC_IMAGEKIT_3D_ENABLED: "false"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          PAYMENTS_ENABLED: "false"
        run: |
          npx wrangler whoami
          npm run deploy

      - name: Smoke test production
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            local marker="$2"

            for attempt in 1 2 3 4 5 6; do
              body="$(curl -fsSL --connect-timeout 10 --max-time 30 "$url?deploy=${GITHUB_SHA}" || true)"
              if grep -Fq "$marker" <<< "$body"; then
                echo "Smoke test passed: $url"
                return 0
              fi

              echo "Smoke test attempt $attempt failed for $url"
              sleep 5
            done

            echo "Smoke test failed: $url did not contain expected marker: $marker"
            return 1
          }

          check_url "https://physionexusacademy.com/" "Check Symptoms"
          check_url "https://physionexusacademy.com/symptom-checker" "PNA Clinical Screening"
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-content-revision="storytelling-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/myofascial-release" 'data-pna-editorial="v2"'
