name: Deploy PNA to Cloudflare

on:
  push:
    branches:
      - cloudflare-deploy
  workflow_dispatch:

concurrency:
  group: pna-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Pin the deployment runner image to avoid moving ubuntu-latest image transitions.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check Cloudflare credentials
        id: auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token is configured."
          else
            echo "::error::Cloudflare deployment cannot run: CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Run TypeScript checks
        if: steps.auth.outputs.ready == 'true'
        run: npm run typecheck

      - name: Validate MSK screening engine
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:msk

      - name: Validate every MSK clinical story
        if: steps.auth.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/validate-msk-stories.mjs

      - name: Validate Conditions & Treatment Guide (fresh data, complete guides, redirects, no retired links)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:conditions

      - name: Validate worldwide manual therapy chapters
        if: steps.auth.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/validate-manual-therapy-world.mjs

      - name: Validate PNA story depth and clinical content
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-manual-therapy-stories.mjs

      - name: Validate accessible-English technique attention and deep guides
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-manual-therapy-attention.mjs

      - name: Validate Manual Therapy visual manifest (inactive until 35 approved)
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-manual-visuals.mjs

      - name: Validate PNA Daily Challenge question bank, scoring, privacy and midnight rankings
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-daily-challenge.mjs

      - name: Validate PNA premium homepage structure, feature coverage and mobile UI
        if: steps.auth.outputs.ready == 'true'
        run: node scripts/validate-premium-homepage.mjs

      - name: Validate PNA Teacher lessons, static lesson data and progress logic
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:teacher

      - name: Validate Clinical Skills Lab content, generated data and wiring
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:skills

      - name: Validate Virtual Patient cases, anatomy mapping, scoring and model
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:virtual-patient

      - name: Validate RehabVerse exercise library (clinical fields, English + Roman Urdu, references, 3D motion)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-library

      - name: Validate RehabVerse decision-support rules (advisory only, most cautious rule wins)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-rules

      - name: Validate the RehabVerse AI assistant (safety screen, reply guard, fallback, privacy, admin-only switch)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-ai

      - name: Validate the RehabVerse exercise coach (safety screen, plan-grounded answers, physiotherapist routing, guard, every library exercise)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-coach

      - name: Validate the RehabVerse check-in chat (denials vs warning signs, safety question, model guard, privacy, wiring)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-checkin

      - name: Validate the RehabVerse AI pilot and review pack (safety behaviour on sample sentences, stable version, sign-off wiring)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-pilot

      - name: Validate the guide and Teacher gestures (hello is a wave, presenting palms, natural talking, same gestures everywhere)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-guide-motion

      - name: Validate the lying exercises' resting poses (hands on the bed, legs supported, an exercise's own joints left alone)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-resting

      - name: Validate the RehabVerse AI chats answer in the patient's language (Roman Urdu in, Roman Urdu out; wrong-language model replies refused)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-reply-lang

      - name: Validate the Claude chat layer (request shape, failures fall back to the free chain, key only in the Worker, no SDK in the bundle)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-claude

      - name: Validate the Groq chat layer (request shape, failures fall back, key only in the Worker, no key in the repository)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-groq

      - name: Validate the motion policy (animations and 3D play unless the visitor chose calm; the PNA Teacher keeps its patient)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:motion

      - name: Validate smooth 3D (resolution adapts without rebuilding shaders, shaders ready before the first movement, no blur over the canvas, the guide and overlays at the screen's rate, the Teacher moves like a person)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:3d-smooth

      - name: Validate the 3D resolution governor (climbs on a fast device, settles on a medium one, drops on a slow one, ignores one stall)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:3d-governor

      - name: Validate stability (public pages are saved for a cut connection and nothing private is, the offline page helps, the backup address is never indexed, the real address is untouched)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:resilience

      - name: Validate easy touch (44px tap targets, 16px form text, no text under 11px, easy-touch layer loads last)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:easy-touch

      - name: Validate the RehabVerse chat screens (every question has an example and tap answers in both languages, every tap is understood, big labelled controls)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-chat-ui

      - name: Validate the site assistant's written answers (only from PNA content, in the question's language, guarded)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:pna-ai-grounded

      - name: Validate the RehabVerse history brief (nothing invented, no diagnosis, quotes exact, missed safety wording surfaced)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-brief

      - name: Validate the worker stubs (nothing reaches for the Supabase parts the server build removes)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:worker-stubs

      - name: Validate RehabVerse database (RLS, roles, unlock rules, audit trail)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-db

      - name: Validate RehabVerse account approval (no confirmation e-mail, the clinic approves, a waiting account can do nothing)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:rehabverse-approval

      - name: Validate student accounts (private record, XP caps, outbox, insights)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:student

      - name: Validate the edge cache key (a new deploy never serves the previous build's pages)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:edge-cache

      - name: Validate the language switch (every menu place and Skills Lab concept has Roman Urdu)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:language

      - name: Validate Manual Therapy depth (every technique has expert depth and a 2D demonstration, no level labels)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:manual-depth

      - name: Validate no level barriers (skills, conditions, cases, exercises show full depth, nothing behind a level or lock)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:no-levels

      - name: Validate the admin workspace (access checks intact, service-role client kept out of the browser, every section reachable)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:admin

      - name: Validate Dr. Sajjad teaching data (every spoken line resolves in English and Roman Urdu, JSON is fresh)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:avatar

      - name: Validate voice choice and Roman Urdu reading (English, Hindi, Urdu, no voice)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:speech

      - name: Validate search-result title and description helpers
        if: steps.auth.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/validate-seo-text.ts

      - name: Validate Physio Nexus AI answers, Roman Urdu understanding and emergency safety
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:ai

      - name: Validate Physio Nexus AI explanations (every lesson and condition, English and Roman Urdu)
        if: steps.auth.outputs.ready == 'true'
        run: npm run validate:ai-explain

      - name: Build and deploy to Cloudflare
        if: steps.auth.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Dedicated Clinical Registry project only. These are optional at build
          # time so the main PNA site can still deploy while Registry setup is gated.
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_URL }}
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLINICAL_REGISTRY_CONSENT_VERSION: ${{ vars.CLINICAL_REGISTRY_CONSENT_VERSION }}

          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: qoc7ukqs
          NEXT_PUBLIC_CLOUDINARY_3D_ENABLED: "true"
          NEXT_PUBLIC_IMAGEKIT_3D_ENABLED: "false"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Claude Haiku (pay-as-you-go) for the RehabVerse chats. Optional: without it the chats run on the free Workers AI chain.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Groq (free tier) for the same chats and the site assistant's written answers. Optional.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAYMENTS_ENABLED: "false"
        run: |
          # Publish is controlled by the reviewed 35-cover manifest (not a
          # GitHub-only env variable unavailable inside Cloudflare Workers).
          if node -e "process.exit(require('./src/data/manual-therapy-visual-manifest.json').publish ? 0 : 1)"; then
            node scripts/validate-manual-visuals.mjs --publish
          fi
          npx wrangler whoami

          # Email secrets must exist in the deployed Worker runtime, not only in the CI build environment.
          if [ -n "${RESEND_API_KEY}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "::warning::RESEND_API_KEY is not configured; reviewer email alerts will be skipped."
          fi
          if [ -n "${RESEND_FROM_EMAIL}" ]; then
            printf '%s' "$RESEND_FROM_EMAIL" | npx wrangler secret put RESEND_FROM_EMAIL
          fi

          # The hourly reminder cron (custom-worker.ts) reads the database key from the Worker environment as well.
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not configured; reminder e-mails will be skipped."
          fi

          # The chats call Claude from inside the Worker, so the key must exist in the Worker runtime, never in the build or the browser.
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          else
            echo "::warning::ANTHROPIC_API_KEY is not configured; the RehabVerse chats stay on the free Workers AI chain."
          fi

          if [ -n "${GROQ_API_KEY}" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          else
            echo "::warning::GROQ_API_KEY is not configured; Groq is not used."
          fi

          npm run deploy

      # Some visitors' Chrome showed "This site can't be reached ... ERR_QUIC_PROTOCOL_ERROR" for physionexusacademy.com. Cloudflare told browsers to use
      # HTTP/3 (QUIC, over UDP) with "alt-svc: h3", and on networks, VPNs or security software that mishandle QUIC the connection fails. HTTP/2 over TCP works
      # everywhere, so HTTP/3 is switched off for the zone on every deploy (idempotent). It never blocks a deploy: if the token may not edit zone settings,
      # the step says so and tells the owner the one switch to flip in the Cloudflare dashboard.
      - name: Turn off HTTP/3 (QUIC) for physionexusacademy.com so nobody gets ERR_QUIC_PROTOCOL_ERROR
        if: steps.auth.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$@"; }
          manual() { echo "::warning::$1 Do it by hand: Cloudflare dashboard > physionexusacademy.com > Speed > Settings (or Network) > HTTP/3 (with QUIC) > Off."; }
          base="https://api.cloudflare.com/client/v4"

          zone_json="$(api "$base/zones?name=physionexusacademy.com&per_page=1" || true)"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
          if [ -z "$zone_id" ]; then
            printf '%s' "$zone_json" | jq -c '{success, errors}' 2>/dev/null || true
            manual "The Cloudflare token cannot read the zone, so HTTP/3 was not changed."
            exit 0
          fi

          current="$(api "$base/zones/$zone_id/settings/http3" | jq -r '.result.value // "unknown"' 2>/dev/null || echo unknown)"
          echo "HTTP/3 (QUIC) is currently: $current"
          if [ "$current" != "off" ]; then
            result="$(api -X PATCH "$base/zones/$zone_id/settings/http3" --data '{"value":"off"}' || true)"
            if [ "$(printf '%s' "$result" | jq -r '.success' 2>/dev/null)" = "true" ]; then
              echo "HTTP/3 (QUIC) is now off for physionexusacademy.com."
            else
              printf '%s' "$result" | jq -c '{success, errors}' 2>/dev/null || true
              manual "The Cloudflare token is not allowed to edit zone settings (it needs Zone > Zone Settings > Edit), so HTTP/3 was not changed."
              exit 0
            fi
          fi

          # The edge stops advertising HTTP/3 within a few minutes; look for it for up to 4 minutes.
          for attempt in 1 2 3 4 5 6 7 8; do
            alt="$(curl -sS -m 20 -I "https://physionexusacademy.com/" | tr -d '\r' | grep -i '^alt-svc:' || true)"
            if [ -z "$alt" ]; then echo "Confirmed: the site no longer advertises HTTP/3 (no alt-svc header)."; exit 0; fi
            echo "Still advertised (attempt $attempt): $alt"
            sleep 30
          done
          echo "::warning::The setting is off but the edge still sent an alt-svc header after 4 minutes; it should clear shortly. Check: curl -sI https://physionexusacademy.com/ | grep -i alt-svc"

      - name: Send every http:// visit to https:// (Always Use HTTPS), so nobody browses or signs in over plain text and no network filter reads the page
        if: steps.auth.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$@"; }
          manual() { echo "::warning::$1 Do it by hand: Cloudflare dashboard > physionexusacademy.com > SSL/TLS > Edge Certificates > Always Use HTTPS > On."; }
          base="https://api.cloudflare.com/client/v4"

          zone_json="$(api "$base/zones?name=physionexusacademy.com&per_page=1" || true)"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
          if [ -z "$zone_id" ]; then
            printf '%s' "$zone_json" | jq -c '{success, errors}' 2>/dev/null || true
            manual "The Cloudflare token cannot read the zone, so Always Use HTTPS was not changed."
            exit 0
          fi

          current="$(api "$base/zones/$zone_id/settings/always_use_https" | jq -r '.result.value // "unknown"' 2>/dev/null || echo unknown)"
          echo "Always Use HTTPS is currently: $current"
          if [ "$current" != "on" ]; then
            result="$(api -X PATCH "$base/zones/$zone_id/settings/always_use_https" --data '{"value":"on"}' || true)"
            if [ "$(printf '%s' "$result" | jq -r '.success' 2>/dev/null)" = "true" ]; then
              echo "Always Use HTTPS is now on for physionexusacademy.com."
            else
              printf '%s' "$result" | jq -c '{success, errors}' 2>/dev/null || true
              manual "The Cloudflare token is not allowed to edit zone settings, so Always Use HTTPS was not changed."
              exit 0
            fi
          fi

          # port 80 must now answer with a redirect to https (not with the page); the edge needs a moment to pick the setting up
          for attempt in 1 2 3 4 5 6; do
            answer="$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://physionexusacademy.com/" || true)"
            case "$answer" in
              301\ https://*|308\ https://*) echo "Confirmed: http://physionexusacademy.com/ answers $answer"; exit 0 ;;
            esac
            echo "Not redirecting yet (attempt $attempt): $answer"
            sleep 20
          done
          echo "::warning::Always Use HTTPS is on but port 80 did not answer with a redirect within 2 minutes; check: curl -sI http://physionexusacademy.com/"

      - name: "Encrypted Client Hello - keep it OFF (confirmed 21 Nov 2026 - with it on, Chrome could not open the site on the owner's provider network; every other browser could, and the site opened at once when it was switched off)"
        if: steps.auth.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Chrome (and other Chromium browsers) use Encrypted Client Hello whenever the site's DNS HTTPS record carries it, and do not fall back to a plain
          # handshake if that attempt is cut on the way; browsers that do not read the record (Firefox without DNS over HTTPS) connect the ordinary way.
          # CONFIRMED: the owner's Chrome (PC and phone) failed on the provider's automatic DNS while other browsers opened the site, and the site opened perfectly in
          # Chrome as soon as ECH was switched off. Keep it off; switching it on again brings the problem back for Chrome users on such networks.
          DESIRED_ECH: "off"
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$@"; }
          manual() { echo "::warning::$1 Do it by hand: Cloudflare dashboard > physionexusacademy.com > SSL/TLS > Edge Certificates > Encrypted Client Hello > ${DESIRED_ECH}."; }
          base="https://api.cloudflare.com/client/v4"
          zone_json="$(api "$base/zones?name=physionexusacademy.com&per_page=1" || true)"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
          if [ -z "$zone_id" ]; then manual "The Cloudflare token cannot read the zone, so Encrypted Client Hello was not checked."; exit 0; fi
          current="$(api "$base/zones/$zone_id/settings/ech" | jq -r '.result.value // "unknown"' 2>/dev/null || echo unknown)"
          echo "Encrypted Client Hello is currently: $current (wanted: $DESIRED_ECH)"
          if [ "$current" = "$DESIRED_ECH" ]; then exit 0; fi
          result="$(api -X PATCH "$base/zones/$zone_id/settings/ech" --data "{\"value\":\"${DESIRED_ECH}\"}" || true)"
          if [ "$(printf '%s' "$result" | jq -r '.success' 2>/dev/null)" = "true" ]; then
            echo "Encrypted Client Hello is now ${DESIRED_ECH} for physionexusacademy.com."
          else
            printf '%s' "$result" | jq -c '{success, errors}' 2>/dev/null || true
            manual "The Cloudflare token could not switch Encrypted Client Hello ${DESIRED_ECH}."
          fi

      - name: Smoke test production
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # A lesson page may have 3-6 assertions. Fetch its HTML only once:
          # repeated full-size SSR responses can overload the origin and produce
          # false-negative 503 / 30-second timeout errors.
          smoke_tmp="$(mktemp -d)"
          trap 'rm -rf "$smoke_tmp"' EXIT
          declare -A smoke_cache=()

          check_url() {
            local url="$1"
            local marker="$2"
            local cached="${smoke_cache[$url]:-}"
            if [ -n "$cached" ]; then
              if grep -Fq "$marker" "$cached"; then
                echo "Smoke test passed (cached): $url"
                return 0
              fi
              echo "::error::Marker missing in cached successful response: $url :: $marker"
              return 1
            fi

            local html
            html="$(mktemp "$smoke_tmp/page.XXXXXXXX")"
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --connect-timeout 10 --max-time 25 \
                -o "$html" "$url?deploy=${GITHUB_SHA}"; then
                if grep -Fq "$marker" "$html"; then
                  smoke_cache["$url"]="$html"
                  echo "Smoke test passed: $url"
                  # Protect Cloudflare Workers from a burst of large SSR responses.
                  sleep 0.8
                  return 0
                fi
              fi

              echo "Smoke test attempt $attempt failed for $url"
              # Gradually back off after transient Worker 503s without masking persistent failure.
              sleep "$((attempt * 3 + 2))"
            done

            echo "::error::Smoke test failed: $url did not return the expected marker after retries: $marker"
            return 1
          }

          check_url "https://physionexusacademy.com/" 'href="/symptom-checker"'
          check_url "https://physionexusacademy.com/" "Open Physio Nexus AI"
          check_url "https://physionexusacademy.com/" 'data-pna-home-signature="v2"'
          check_url "https://physionexusacademy.com/" "Install PNA App"
          check_url "https://physionexusacademy.com/manifest.webmanifest" '"name": "Physio Nexus Academy"'
          check_url "https://physionexusacademy.com/sw.js" "PNA update-first service worker."
          check_url "https://physionexusacademy.com/symptom-checker" "PNA Clinical Screening"
          check_url "https://physionexusacademy.com/daily-challenge" 'data-pna-daily-challenge="v1"'
          # PNA Teacher: hub, one lesson and one path must render on the Worker (not only prerender locally).
          check_url "https://physionexusacademy.com/learn" 'data-pna-teacher-hub="v1"'
          check_url "https://physionexusacademy.com/learn/convex-concave-rule" 'data-pna-teacher-lesson="convex-concave-rule"'
          check_url "https://physionexusacademy.com/learn/paths/knee-rehab-mastery" "Knee Rehab Mastery"
          check_url "https://physionexusacademy.com/learn/gait-cycle" 'data-pna-teacher-lesson="gait-cycle"'
          # Lesson bodies are static assets outside the Worker; the player fetches them on demand.
          check_url "https://physionexusacademy.com/teacher-data/lessons/convex-concave-rule.json" '"slug":"convex-concave-rule"'
          # Every Manual Therapy chapter opens with PNA Teacher (technique + world approach layouts).
          check_url "https://physionexusacademy.com/manual-therapy/maitland-joint-mobilization" 'data-pna-technique-teacher="maitland-joint-mobilization"'
          check_url "https://physionexusacademy.com/manual-therapy/mckenzie-mdt" 'data-pna-technique-teacher="mckenzie-mdt"'
          check_url "https://physionexusacademy.com/api/daily-challenge/leaderboard" '"challengeDate"'
          check_url "https://physionexusacademy.com/api/daily-challenge/status" '"database":"ready"'

          # Exercise real POST route handling without creating fake attempts or scores.
          start_http="$(curl -sS --connect-timeout 10 --max-time 25 -o "$smoke_tmp/daily-start.json" \
            -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"fullName":"","email":"","consent":false}' \
            'https://physionexusacademy.com/api/daily-challenge/start')"
          if [ "$start_http" != "400" ] || ! grep -Fq 'Enter a name' "$smoke_tmp/daily-start.json"; then
            echo "::error::Daily start API failed to return expected 400 validation response (HTTP $start_http)"
            exit 1
          fi
          echo "Smoke test passed: Daily Challenge start POST validation"

          submit_http="$(curl -sS --connect-timeout 10 --max-time 25 -o "$smoke_tmp/daily-submit.json" \
            -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"attemptId":"invalid","token":"invalid","answers":{}}' \
            'https://physionexusacademy.com/api/daily-challenge/submit')"
          if [ "$submit_http" != "400" ] || ! grep -Fq 'not found' "$smoke_tmp/daily-submit.json"; then
            echo "::error::Daily submit API failed to return expected 400 validation response (HTTP $submit_http)"
            exit 1
          fi
          echo "Smoke test passed: Daily Challenge submit POST validation"
          # Keep production verification intentionally small. The local validation
          # scripts above already validate the full content library; crawling every
          # large SSR page after deploy can overload Workers and create false failures.
          check_url "https://physionexusacademy.com/conditions" "Find the condition"
          check_url "https://physionexusacademy.com/conditions/lateral-ankle-sprain" "Lateral Ankle Sprain"
          check_url "https://physionexusacademy.com/conditions-data/lateral-ankle-sprain.json" '"clinical"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-library="unified-35-v1"'
          check_url "https://physionexusacademy.com/manual-therapy" 'data-pna-editorial-design="anatomy-luxe-v1"'
          check_url "https://physionexusacademy.com/manual-therapy/myofascial-release" 'data-pna-reading="clinical-story-v3"'
          check_url "https://physionexusacademy.com/manual-therapy/strain-counterstrain" 'data-pna-reading="clinical-story-v3"'
          check_url "https://physionexusacademy.com/manual-therapy/mulligan-snags-nags" 'data-pna-reading="clinical-story-v3"'
          check_url "https://physionexusacademy.com/manual-therapy/regions/by-region/cervical" 'data-pna-region-overviews="v1"'
          check_url "https://physionexusacademy.com/skills" "Clinical Skills Lab"
          check_url "https://physionexusacademy.com/skills/goniometry" 'data-pna-skill-page="goniometry"'
          check_url "https://physionexusacademy.com/skills-data/manual-muscle-testing.json" '"slug":"manual-muscle-testing"'
          check_url "https://physionexusacademy.com/virtual-patient" 'data-pna-virtual-patient'
          check_url "https://physionexusacademy.com/virtual-patient/patient.glb" 'glTF'

          # Exercise the read-only PNA AI resource navigator. These requests do not submit forms or create records.
          node scripts/validate-pna-ai-production.mjs

      - name: Check the backup address (workers.dev) answers, is never indexed, and the offline page is live
        if: steps.auth.outputs.ready == 'true'
        # A problem here must not mark a healthy deployment of the real address as failed: it is reported as a warning.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          backup="https://physio-nexus-academy.physionexusacademypk.workers.dev"
          pass=0
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -sS --connect-timeout 10 --max-time 25 -D - -o /tmp/backup-learn.html "$backup/learn/gait-cycle?deploy=${GITHUB_SHA}" 2>&1)" || headers=""
            robots="$(curl -sS --connect-timeout 10 --max-time 25 "$backup/robots.txt" 2>&1)" || robots=""
            if echo "$headers" | head -1 | grep -q ' 200' \
              && echo "$headers" | grep -iq '^x-robots-tag: noindex, nofollow' \
              && echo "$headers" | grep -iq '^link: <https://physionexusacademy.com/learn/gait-cycle>; rel="canonical"' \
              && grep -Fq 'data-pna-teacher-lesson="gait-cycle"' /tmp/backup-learn.html \
              && echo "$robots" | grep -Fq 'Disallow: /'; then
              pass=1
              break
            fi
            echo "Backup address attempt $attempt not ready yet"
            sleep "$((attempt * 5))"
          done
          if [ "$pass" != "1" ]; then
            echo "::warning::The backup address $backup did not answer as expected (200, noindex header, canonical link, robots.txt Disallow). The real address is not affected. Check Cloudflare dashboard > Workers & Pages > physio-nexus-academy > Settings > Domains & Routes > workers.dev is enabled."
            exit 1
          fi
          echo "The backup address answers, is marked noindex and points to the real page as canonical."
          primary_robots="$(curl -sS --connect-timeout 10 --max-time 25 https://physionexusacademy.com/robots.txt)"
          if echo "$primary_robots" | grep -Eq '^Disallow: /$'; then
            echo "::error::The real address's robots.txt disallows everything. The backup policy must never reach it."
            exit 1
          fi
          echo "The real address's robots.txt is untouched."
          offline="$(curl -fsS --connect-timeout 10 --max-time 25 "https://physionexusacademy.com/offline?deploy=${GITHUB_SHA}")"
          echo "$offline" | grep -Fq "We can't reach the site right now" || { echo "::warning::/offline did not contain the connection-problem page"; exit 1; }
          echo "The offline page is live."

  seo-live:
    name: Verify live SEO (titles, canonicals, structured data, sitemap)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every hub page and a sample of each section on production
        run: node scripts/verify-seo-production.mjs

  offline-live:
    name: Verify live offline behaviour (saved pages and the offline page when the connection is cut)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PNA_BROWSER_QA_DIR: /tmp/pna-offline-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$PNA_BROWSER_QA_DIR" --no-package-lock playwright@1.56.1
          "$PNA_BROWSER_QA_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Cut the connection in a real browser and check what the visitor sees
        run: NODE_PATH="$PNA_BROWSER_QA_DIR/node_modules" node scripts/verify-offline-production.cjs https://physionexusacademy.com

  pathway-images:
    name: Verify live pathway photos and responsive interactions
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PNA_BROWSER_QA_DIR: /tmp/pna-browser-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser QA tooling
        run: |
          npm install --prefix "$PNA_BROWSER_QA_DIR" --no-package-lock playwright@1.56.1
          "$PNA_BROWSER_QA_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify supplied images and production at five viewport widths
        run: node scripts/verify-pathway-production.mjs
      - name: Save live screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pna-pathway-production-${{ github.sha }}
          path: artifacts/pathway-production
          if-no-files-found: error
          retention-days: 14
