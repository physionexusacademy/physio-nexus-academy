name: PNA Pull Request Quality Checks

on:
  pull_request:
    branches:
      - cloudflare-deploy
    paths-ignore:
      - ".github/workflows/deploy-cloudflare-production.yml"

permissions:
  contents: read

concurrency:
  group: pna-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build Next.js application
        env:
          # Public build-time configuration only; no service-role key or API secrets.
          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
        run: npm run build

      - name: Report production dependency advisories
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/pna-npm-audit.json" || true
          node - "$RUNNER_TEMP/pna-npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          try {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const vulnerabilities = report.vulnerabilities || {};
            console.log(JSON.stringify({
              summary: report.metadata?.vulnerabilities || {},
              packages: Object.entries(vulnerabilities).map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable
              }))
            }, null, 2));
          } catch (error) {
            console.log("Could not parse npm audit report:", String(error));
          }
          NODE
