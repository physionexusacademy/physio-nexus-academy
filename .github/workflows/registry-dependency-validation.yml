name: Registry dependency and production build verification

on:
  pull_request:
    branches:
      - fix/registry-case-workflow-authorization
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/registry-dependency-validation.yml"
      - ".github/workflows/registry-dependency-audit-remediation.yml"
      - "src/**"
  push:
    branches:
      - fix/clinical-registry-dependency-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Public, read-only configuration needed by statically rendered PNA pages.
    # No service-role key or write-capable credentials are supplied to this CI job.
    env:
      NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
      NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: qoc7ukqs
      NEXT_PUBLIC_CLOUDINARY_3D_ENABLED: "true"
      NEXT_PUBLIC_IMAGEKIT_3D_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Fail on any known dependency vulnerability
        run: npm audit --audit-level=low

      - name: Type-check application
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Build OpenNext Cloudflare output
        run: npx opennextjs-cloudflare build
