name: Clinical Registry local database security tests

on:
  pull_request:
    paths:
      - "supabase/clinical-registry/**"
      - ".github/workflows/clinical-registry-local-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-schema-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Initialise temporary local Supabase workspace
        run: supabase init

      - name: Start disposable local Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Apply prototype schema and RPCs to local database
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/clinical-registry/private-schema.prototype.sql \
            -f supabase/clinical-registry/api-functions.prototype.sql

      - name: Run synthetic RLS isolation tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/clinical-registry/private-schema.rls.test.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
