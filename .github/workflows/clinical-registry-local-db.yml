name: Clinical Registry local database security tests

on:
  pull_request:
    paths:
      - "supabase/clinical-registry/**"
      - ".github/workflows/clinical-registry-local-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-schema-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY_TEST_DIR: /tmp/clinical-registry-supabase
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Keep the local Supabase config outside the repository. Running
      # "supabase start" from the repository root would replay every PNA
      # migration, including unrelated/incomplete website migrations.
      - name: Initialise isolated Registry test workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REGISTRY_TEST_DIR"
          cd "$REGISTRY_TEST_DIR"
          supabase init

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$REGISTRY_TEST_DIR"
          supabase start -x studio,imgproxy,logflare,vector

      - name: Apply Registry prototype schema and RPCs
        shell: bash
        run: |
          set -euo pipefail
          cd "$REGISTRY_TEST_DIR"
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/clinical-registry/private-schema.prototype.sql" \
            -f "$GITHUB_WORKSPACE/supabase/clinical-registry/api-functions.prototype.sql"

      - name: Run synthetic RLS isolation tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$REGISTRY_TEST_DIR"
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/clinical-registry/private-schema.rls.test.sql"

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          cd "$REGISTRY_TEST_DIR"
          supabase stop --no-backup
