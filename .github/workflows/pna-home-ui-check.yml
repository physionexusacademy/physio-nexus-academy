name: PNA Homepage UI Check

on:
  pull_request:
    branches: [cloudflare-deploy]
    paths:
      - "src/app/page.tsx"
      - "src/app/premium-vision.css"
      - "src/components/home/**"
      - ".github/workflows/pna-home-ui-check.yml"
  workflow_dispatch:

jobs:
  typecheck:
    name: Homepage-specific TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check changed homepage code (repository has existing unrelated TS errors)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > pna-typescript-check.log 2>&1
          status=$?
          set -e
          if grep -E '^src/app/page\.tsx\(|^src/components/home/(PremiumHomeHero|PnaPathwayArtwork|PremiumPathwayBrowser)\.tsx\(' pna-typescript-check.log; then
            echo "Errors detected in redesigned homepage."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "No TypeScript errors in changed homepage files."
            echo "Repository-wide pre-existing TypeScript errors remain outside this PR."
          else
            echo "Repository-wide TypeScript check passed."
          fi
