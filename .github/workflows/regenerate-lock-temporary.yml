name: Regenerate dependency lockfile (temporary)
on:
  push:
    branches:
      - seo-metadata-clean
    paths:
      - package.json
      - .github/workflows/regenerate-lock-temporary.yml
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    if: github.ref == 'refs/heads/seo-metadata-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-metadata-clean
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: regenerate dependency lockfile for supported OpenNext"
            git push origin HEAD:seo-metadata-clean
          fi
