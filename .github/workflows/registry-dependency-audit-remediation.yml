name: Registry dependency audit remediation

on:
  push:
    branches:
      - fix/clinical-registry-dependency-audit

permissions:
  contents: write

concurrency:
  group: registry-dependency-audit-remediation
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clinical-registry-dependency-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply only non-breaking npm audit remediations
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          FIX_EXIT=$?
          set -e
          echo "npm audit fix exit code: $FIX_EXIT"
      - name: Regenerate lockfile from reviewed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile after security updates"
          git push
