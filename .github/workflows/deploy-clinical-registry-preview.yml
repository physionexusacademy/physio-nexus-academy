name: PNA Clinical Registry Preview

on:
  push:
    branches:
      - registry-preview
    paths:
      - ".github/workflows/deploy-clinical-registry-preview.yml"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "supabase/clinical-registry/**"
      - "next.config.js"
      - "wrangler.jsonc"
      - "wrangler.registry-preview.jsonc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pna-clinical-registry-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and validate secure Registry integration
        env:
          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_URL: https://zfoohwqyoengbszuylxj.supabase.co
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NIkVA30c34MyWRCCseRMcA_e2ifI3OX
          NEXT_PUBLIC_CLINICAL_REGISTRY_CONSENT_VERSION: ""
        run: |
          npm run typecheck
          npm run validate:clinical-registry

      - name: Build Cloudflare Worker
        env:
          PNA_PREVIEW_BUILD: "true"
          NEXT_PUBLIC_SITE_URL: https://physionexusacademy.com
          NEXT_PUBLIC_SUPABASE_URL: https://oabckudgmzbbbbhkeolk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p8fvjS5A7XFD3__dGt3KLw_x4jIOOy6
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_URL: https://zfoohwqyoengbszuylxj.supabase.co
          NEXT_PUBLIC_CLINICAL_REGISTRY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NIkVA30c34MyWRCCseRMcA_e2ifI3OX
          NEXT_PUBLIC_CLINICAL_REGISTRY_CONSENT_VERSION: ""
        run: npx opennextjs-cloudflare build

      - name: Check Cloudflare credentials and Preview password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PNA_PREVIEW_ACCESS_PASSWORD: ${{ secrets.PNA_PREVIEW_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          if [ "${#PNA_PREVIEW_ACCESS_PASSWORD}" -lt 32 ]; then
            echo "::error::Add PNA_PREVIEW_ACCESS_PASSWORD as a GitHub Actions secret with at least 32 characters. Preview deployment is blocked until configured."
            exit 1
          fi
          npx wrangler whoami

      - name: Install fail-closed Preview Worker password secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PNA_PREVIEW_ACCESS_PASSWORD: ${{ secrets.PNA_PREVIEW_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$PNA_PREVIEW_ACCESS_PASSWORD" | npx wrangler secret put PNA_PREVIEW_ACCESS_PASSWORD --config wrangler.registry-preview.jsonc

      - name: Deploy isolated Registry Preview Worker
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          npx wrangler deploy --config wrangler.registry-preview.jsonc 2>&1 | tee "$log_file"
          preview_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "::error::Cloudflare deploy completed without returning a workers.dev URL."
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## PNA Clinical Registry Preview"
            echo ""
            echo "Preview URL: $preview_url"
            echo ""
            echo "This is an isolated Worker. It does not attach to the production custom domain."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test Preview access gate and Registry routes
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PNA_PREVIEW_ACCESS_PASSWORD: ${{ secrets.PNA_PREVIEW_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          unauth_body="$(mktemp)"
          unauth_headers="$(mktemp)"
          registry_html="$(mktemp)"
          library_html="$(mktemp)"
          registry_headers="$(mktemp)"
          trap 'rm -f "$unauth_body" "$unauth_headers" "$registry_html" "$library_html" "$registry_headers"' EXIT

          unauth_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -D "$unauth_headers" -o "$unauth_body" -w '%{http_code}' "$PREVIEW_URL/clinical-registry")"
          if [ "$unauth_status" != "401" ]; then
            echo "::error::Unauthenticated Preview request returned $unauth_status instead of 401."
            exit 1
          fi
          grep -Fqi 'www-authenticate: Basic realm="PNA Clinical Registry Preview"' "$unauth_headers"

          registry_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --user "pna-preview:$PNA_PREVIEW_ACCESS_PASSWORD" -D "$registry_headers" -o "$registry_html" -w '%{http_code}' "$PREVIEW_URL/clinical-registry")"
          if [ "$registry_status" != "200" ]; then
            echo "::error::Authenticated Registry Preview route returned $registry_status instead of 200."
            exit 1
          fi
          grep -Fq "Clinical Registry" "$registry_html"
          grep -Fqi "x-robots-tag: noindex, nofollow" "$registry_headers"

          library_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --user "pna-preview:$PNA_PREVIEW_ACCESS_PASSWORD" "$PREVIEW_URL/clinical-registry/library" -o "$library_html" -w '%{http_code}')"
          if [ "$library_status" != "200" ]; then
            echo "::error::Authenticated case-library Preview route returned $library_status instead of 200."
            exit 1
          fi
          grep -Fq "Public Clinical Case Library" "$library_html"
          echo "Preview denies unauthenticated access and serves both Registry routes only with the configured password."

      - name: Verify exact-origin consent verifier CORS
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          REGISTRY_SUPABASE_URL: https://zfoohwqyoengbszuylxj.supabase.co
        run: |
          set -euo pipefail
          allowed_headers="$(mktemp)"
          denied_headers="$(mktemp)"
          trap 'rm -f "$allowed_headers" "$denied_headers"' EXIT
          function_url="$REGISTRY_SUPABASE_URL/functions/v1/verify-consent-evidence"
          curl --silent --show-error --output /dev/null --dump-header "$allowed_headers" -X OPTIONS \
            -H "Origin: $PREVIEW_URL" \
            -H "Access-Control-Request-Method: POST" \
            "$function_url"
          grep -Fqi "access-control-allow-origin: $PREVIEW_URL" "$allowed_headers"
          curl --silent --show-error --output /dev/null --dump-header "$denied_headers" -X OPTIONS \
            -H "Origin: https://not-allowed.invalid" \
            -H "Access-Control-Request-Method: POST" \
            "$function_url"
          if grep -Fqi "access-control-allow-origin: https://not-allowed.invalid" "$denied_headers"; then
            echo "::error::Consent verifier accepted an unlisted CORS origin."
            exit 1
          fi
          echo "Consent verifier allows the exact Preview origin and denies an unlisted origin."
