name: Diagnose Cloudflare (read-only)

# Run by hand (Actions > Diagnose Cloudflare > Run workflow) when visitors report that the site does not open.
# It only READS: the zone's TLS / security / network settings and rules, what changed recently (the account audit log), the certificate and the
# Worker's custom domain, and how the site answers from the GitHub runner's network (TLS versions, HTTP versions, each Cloudflare address, the
# edge's own /cdn-cgi/trace). It never changes anything and never prints the API token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cloudflare zone, certificate, custom domain and what changed recently (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::warning::No CLOUDFLARE_API_TOKEN secret."; exit 0; fi
          api() { curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4"

          zone_json="$(api "$base/zones?name=physionexusacademy.com&per_page=1")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')"
          acct_id="$(printf '%s' "$zone_json" | jq -r '.result[0].account.id // empty')"
          if [ -z "$zone_id" ]; then echo "Cannot read the zone:"; printf '%s' "$zone_json" | jq -c '{success, errors}'; exit 0; fi
          echo "=== zone"
          printf '%s' "$zone_json" | jq -r '.result[0] | {name, status, paused, type, development_mode, modified_on, activated_on} | tostring'

          echo; echo "=== certificate packs (type, status, hosts, issuer and dates)"
          api "$base/zones/$zone_id/ssl/certificate_packs?status=all" | jq -r '.result[]? | "pack type=\(.type) status=\(.status) hosts=\(.hosts|join(",")) ca=\(.certificate_authority // "-") validation=\(.validation_method // "-") validity_days=\(.validity_days // "-")", (.certificates[]? | "   cert issuer=\(.issuer // "-") status=\(.status // "-") uploaded=\(.uploaded_on // "-") modified=\(.modified_on // "-") expires=\(.expires_on // "-")")'
          echo "-- universal ssl settings"; api "$base/zones/$zone_id/ssl/universal/settings" | jq -c '.result // .errors'
          echo "-- ssl verification"; api "$base/zones/$zone_id/ssl/verification" | jq -c '[.result[]? | {hostname: .certificate_status, brand_check, cert_pack_uuid}] // .errors' 2>/dev/null | head -c 600; echo

          echo; echo "=== Worker custom domains of the account"
          api "$base/accounts/$acct_id/workers/domains" | jq -r '.result[]? | "\(.hostname)\tservice=\(.service)\tenv=\(.environment)\tzone=\(.zone_name)\tid=\(.id)"'
          echo "-- worker routes on the zone"; api "$base/zones/$zone_id/workers/routes" | jq -r '.result[]? | "\(.pattern)\t\(.script // "-")"'

          echo; echo "=== Worker deployments (newest first)"
          api "$base/accounts/$acct_id/workers/scripts/physio-nexus-academy/deployments" | jq -r '.result.deployments[:6][]? | "\(.created_on)\tsource=\(.source)\tversions=\([.versions[]? | "\(.percentage)%:\(.version_id[0:8])"] | join(","))"'

          echo; echo "=== what changed on the account in the last 36 hours (audit log; actor type only)"
          since="$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          api "$base/accounts/$acct_id/audit_logs?since=$since&per_page=100&direction=desc" | jq -r '.result[]? | "\(.when)\t\(.action.type)\t\(.resource.type)\t\(.actor.type)\t\((.resource.id // "")[0:12])"' | head -60
          api "$base/accounts/$acct_id/audit_logs?since=$since&per_page=1" | jq -c 'select(.success==false) | .errors'

          echo; echo "=== zone settings"
          api "$base/zones/$zone_id/settings" | jq -r '.result[]? | select(.id|test("ech|tls|ssl|http|ipv6|pq_keyex|security|browser_check|always_use_https|opportunistic|min_tls|0rtt|challenge")) | "\(.id): \(.value|tostring)  (modified \(.modified_on // "-"))"' | sort

          echo; echo "=== firewall / rules (counts only)"
          for phase in http_request_firewall_custom http_ratelimit http_request_firewall_managed; do
            echo "$phase: rules=$(api "$base/zones/$zone_id/rulesets/phases/$phase/entrypoint" | jq -r '[.result.rules[]?] | length')"
          done

      - name: How the site answers from this network
        shell: bash
        run: |
          set +e
          url="https://physionexusacademy.com/"
          echo "=== the edge's own view (/cdn-cgi/trace), 4 times"
          for i in 1 2 3 4; do curl -sS -m 20 "${url}cdn-cgi/trace" | grep -E '^(colo|http|tls|sni|loc|warp)=' | tr '\n' ' '; echo; done

          echo; echo "=== certificate served on each Cloudflare address"
          for ip in 172.67.188.121 104.21.8.143; do
            echo "-- $ip"
            echo | openssl s_client -connect "$ip:443" -servername physionexusacademy.com 2>/dev/null | openssl x509 -noout -serial -issuer -startdate -enddate 2>/dev/null
            curl -sS -o /dev/null -m 20 --resolve "physionexusacademy.com:443:$ip" -w 'status=%{http_code} tls=%{time_appconnect}\n' "$url"
          done

          echo; echo "=== different TLS / HTTP versions and a few pages"
          for o in "--http1.1" "--tlsv1.2 --tls-max 1.2" "--tlsv1.3"; do printf '%-26s' "$o"; curl -sS -o /dev/null -m 20 -w '%{http_code} %{http_version}\n' $o "$url" 2>&1 | tail -1; done
          for p in robots.txt sitemap.xml manifest.webmanifest sw.js favicon.ico; do printf '%-22s' "$p"; curl -sS -o /dev/null -m 20 -w '%{http_code} %{size_download}B\n' "$url$p" 2>&1 | tail -1; done

          echo; echo "=== headers"
          curl -sSI -m 20 "$url" | tr -d '\r' | grep -iE '^(HTTP|server|cf-ray|cf-cache-status|alt-svc|strict-transport|location|content-length|content-encoding)'

          echo; echo "=== port 80"
          curl -sSI -m 20 "http://physionexusacademy.com/" | tr -d '\r' | head -6

          echo; echo "=== DNS from 1.1.1.1 and 8.8.8.8 (A, AAAA, HTTPS record with ECH)"
          for r in 1.1.1.1 8.8.8.8; do echo "-- $r"; dig +short @"$r" physionexusacademy.com A; dig +short @"$r" physionexusacademy.com AAAA; dig +short @"$r" physionexusacademy.com HTTPS | cut -c1-200; done

      - name: The other Cloudflare addresses that Pakistan is given (188.114.96.0/20) and what other resolvers answer
        shell: bash
        run: |
          set +e
          url="https://physionexusacademy.com/"
          echo "=== does the site answer correctly on the addresses a Pakistani PC was given? (curl --resolve to each)"
          for ip in 188.114.96.6 188.114.97.6 104.21.8.143 172.67.188.121; do
            printf '%-16s' "$ip"
            curl -sS -o /dev/null -m 20 --resolve "physionexusacademy.com:443:$ip" -w 'status=%{http_code} tls=%{time_appconnect}s total=%{time_total}s\n' "$url" 2>&1 | tail -1
            echo "   trace: $(curl -sS -m 20 --resolve "physionexusacademy.com:443:$ip" "${url}cdn-cgi/trace" 2>&1 | grep -E '^(colo|http|tls|sni)=' | tr '\n' ' ')"
            echo "   cert:  $(echo | openssl s_client -connect "$ip:443" -servername physionexusacademy.com 2>/dev/null | openssl x509 -noout -serial -enddate 2>/dev/null | tr '\n' ' ')"
          done

          echo; echo "=== what different resolvers answer from this network"
          for r in 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 9.9.9.9 208.67.222.222 94.140.14.14; do
            printf '%-16s' "$r"; dig +short +time=3 +tries=1 @"$r" physionexusacademy.com A | tr '\n' ' '; echo
          done

          echo; echo "=== the zone's own name servers (authoritative answers)"
          for ns in ridge.ns.cloudflare.com tia.ns.cloudflare.com; do
            printf '%-26s' "$ns"; dig +short +time=3 +tries=1 @"$ns" physionexusacademy.com A | tr '\n' ' '; echo
          done
          echo "-- with a client-subnet hint from Pakistan (PTCL 39.32.0.0/24, Jazz 119.160.0.0/24, Nayatel 202.163.64.0/24)"
          for sub in 39.32.0.0/24 119.160.0.0/24 202.163.64.0/24; do
            printf '%-20s' "$sub"; dig +short +time=3 +tries=1 +subnet=$sub @ridge.ns.cloudflare.com physionexusacademy.com A | tr '\n' ' '; echo
            printf '%-20s' "  8.8.8.8 + subnet"; dig +short +time=3 +tries=1 +subnet=$sub @8.8.8.8 physionexusacademy.com A | tr '\n' ' '; echo
          done

