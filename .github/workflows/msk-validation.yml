name: Validate PNA MSK Screening Engine

on:
  pull_request:
    branches:
      - cloudflare-deploy
    paths:
      - "src/lib/msk-symptom-checker.ts"
      - "src/app/symptom-checker/**"
      - "scripts/validate-msk-checker.ts"
      - "package.json"
      - ".github/workflows/msk-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MSK validation suite
        run: npm run validate:msk
