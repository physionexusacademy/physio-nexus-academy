name: Temporary PNA brand image optimization

on:
  push:
    branches:
      - performance/brand-image-optimization

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[image-opt-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Optimize existing brand images conservatively
        run: node scripts/optimize-pna-brand-images.mjs
      - name: Commit optimized image assets and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/temp-pna-image-optimization.yml scripts/optimize-pna-brand-images.mjs
          git add -A public/images/pna-logo.png public/images/founder-dr-sajjad.jpg .github/workflows/temp-pna-image-optimization.yml scripts/optimize-pna-brand-images.mjs
          if git diff --cached --quiet; then
            echo "No smaller image output was produced; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[image-opt-bot] optimize logo and founder image"
            git push origin performance/brand-image-optimization
          fi
      - name: Verify project types
        run: npm run typecheck
